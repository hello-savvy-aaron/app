name: DB migrate

# Runs on every push to main and applies any migrations in supabase/migrations/
# not yet recorded on the remote. `supabase db push` is idempotent — migrations
# already in the remote schema_migrations table are skipped, so this is a no-op
# when nothing is pending. Requires the repo secret SUPABASE_DB_URL (Supabase
# Dashboard -> Connect -> Session pooler URI, password included).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
